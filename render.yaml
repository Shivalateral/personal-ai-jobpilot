databases:
  - name: jobpilot-postgres
    databaseName: jobpilot
    user: jobpilot
    plan: free

services:
  - type: web
    name: jobpilot-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: jobpilot-postgres
          property: connectionString
      - key: RESUME_ENCRYPTION_KEY
        generateValue: true
      - key: EMBEDDING_OFFLINE_FALLBACK
        value: "true" # Set false on >=2 GB RAM instances (e.g. Render Standard / Cloud Run 2Gi) to load PyTorch MiniLM
      - key: LLM_PROVIDER
        value: gemini_openai_compatible
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: LLM_MODEL
        value: gemini-3.8-flash
      - key: LLM_API_KEY
        sync: false
      - key: LLM_FALLBACK_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_FALLBACK_MODEL
        value: gpt-4o-mini
      - key: LLM_FALLBACK_API_KEY
        sync: false
      - key: SCHEDULER_ENABLED
        value: "true"

  - type: web
    name: jobpilot-frontend
    runtime: docker
    dockerfilePath: ./Dockerfile.frontend
    plan: starter
    healthCheckPath: /_stcore/health
    envVars:
      - key: FRONTEND_API_URL
        fromService:
          type: web
          name: jobpilot-backend
          property: hostport
      - key: API_AUTH_TOKEN
        sync: false
